server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker: re-resuelve `api` si el contenedor se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API REST y SSE (/api/v1/stream). Sin buffering para que los eventos lleguen al instante.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 10m;
    }

    # Contrato OpenAPI y documentación interactiva de FastAPI.
    location ~ ^/(openapi\.json|docs) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Módulos ES (worker de MapLibre): los navegadores exigen tipo MIME de JavaScript.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Rutas de la exportación estática (trailingSlash: true → /pmu/index.html).
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
