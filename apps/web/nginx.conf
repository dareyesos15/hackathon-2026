# HTTP (:8080) para el portátil del PMU y HTTPS (:8443) para los celulares: los navegadores solo
# entregan el GPS (navigator.geolocation) en contextos seguros. El certificado es autofirmado y
# se genera en el build de la imagen (el celular pide aceptarlo una vez).
server {
    listen 8080;
    server_name _;
    include /etc/nginx/dacora-locations.conf;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/dacora.crt;
    ssl_certificate_key /etc/nginx/certs/dacora.key;
    include /etc/nginx/dacora-locations.conf;
}
